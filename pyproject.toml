[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamletkg"
version = "0.2.0"
description = "Algorithm-first multi-granular event knowledge graphs for AML research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HAMLET-KG Research Project"}]
keywords = ["knowledge-graph", "large-language-model", "anti-money-laundering", "temporal-graph", "case-retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
hamletkg = "hamletkg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
